name: Release CLI (SEA)

# This workflow uses Node.js SEA (Single Executable Applications) to build the CLI
# It replaces the deprecated caxa-based build
#
# IMPORTANT: The turbotCoreBranch must have the compile-sea.sh script

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "The version number of the new release, without v (e.g., 1.32.0)"
        required: true
        default: "1.32.0-sea.1"
      turbotCoreBranch:
        description: "The branch name from turbotio/turbot-core repo (must have compile-sea.sh)"
        required: true
        default: "develop"

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build ${{ matrix.platform }} Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: turbot-linux-x64
            archive: linux_amd64
          - os: windows-latest
            platform: windows-x64
            binary: turbot-windows-x64.exe
            archive: windows_amd64
          - os: macos-15-intel
            platform: darwin-x64
            binary: turbot-macos-x64
            archive: darwin_amd64
          - os: macos-latest
            platform: darwin-arm64
            binary: turbot-macos-arm64
            archive: darwin_arm64

    steps:
      - name: Configure Git for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.protectNTFS false
          git config --global core.longpaths true

      - name: Checkout turbot-core repository
        uses: actions/checkout@v4
        with:
          repository: turbotio/turbot-core
          ref: ${{ github.event.inputs.turbotCoreBranch }}
          ssh-key: ${{ secrets.TURBOT_CLI_DEPLOY_PRIVATE_KEY }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build TypeScript packages
        shell: bash
        run: bash scripts/build-ts-modules.sh

      - name: Verify compile-sea.sh exists
        shell: bash
        run: |
          if [[ ! -f "lib/@turbot/cli/compile-sea.sh" ]]; then
            echo "❌ compile-sea.sh not found in branch ${{ github.event.inputs.turbotCoreBranch }}"
            echo "   Make sure the branch has the SEA build scripts"
            exit 1
          fi
          echo "✅ compile-sea.sh found"

      - name: Make build scripts executable
        shell: bash
        run: |
          chmod +x lib/@turbot/cli/compile-sea.sh
          chmod +x lib/@turbot/cli/discover-dependencies.sh 2>/dev/null || true

      - name: Build CLI binary
        shell: bash
        run: |
          cd lib/@turbot/cli
          ./compile-sea.sh ${{ matrix.platform }} --version ${{ github.event.inputs.releaseVersion }}

      - name: Verify binary was created
        shell: bash
        run: |
          if [[ -f "lib/@turbot/cli/dist/${{ matrix.binary }}" ]]; then
            SIZE=$(du -h "lib/@turbot/cli/dist/${{ matrix.binary }}" | cut -f1)
            echo "✅ Binary verified: ${{ matrix.binary }} ($SIZE)"
            ls -lh lib/@turbot/cli/dist/
          else
            echo "❌ Binary not found: lib/@turbot/cli/dist/${{ matrix.binary }}"
            ls -lh lib/@turbot/cli/dist/ 2>/dev/null || echo "dist/ directory not found"
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbot-cli-${{ matrix.platform }}-binary
          path: lib/@turbot/cli/dist/${{ matrix.binary }}
          retention-days: 30

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbot-cli-${{ matrix.platform }}-archive
          path: lib/@turbot/cli/dist/turbot_cli_*_${{ matrix.archive }}.zip
          retention-days: 30

      - name: Save build info (once)
        if: matrix.platform == 'linux-x64'
        shell: bash
        run: |
          echo "$(git rev-parse --short HEAD)" > lib/@turbot/cli/dist/commit.txt
          echo "📌 Saved commit: $(cat lib/@turbot/cli/dist/commit.txt)"

      - name: Upload build info
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: lib/@turbot/cli/dist/commit.txt
          retention-days: 30

  test-binaries:
    name: Test ${{ matrix.platform }} Binary
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary: turbot-linux-x64
          - os: windows-latest
            platform: windows-x64
            binary: turbot-windows-x64.exe
          - os: macos-15-intel
            platform: darwin-x64
            binary: turbot-macos-x64
          - os: macos-latest
            platform: darwin-arm64
            binary: turbot-macos-arm64

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: turbot-cli-${{ matrix.platform }}-binary
          path: .

      - name: Make binary executable (Unix)
        if: runner.os != 'Windows'
        run: chmod +x ${{ matrix.binary }}

      - name: Test --version
        shell: bash
        run: |
          echo "Testing ${{ matrix.binary }} --version..."
          ./${{ matrix.binary }} --version
          echo "✅ Version check passed"

      - name: Test --help
        shell: bash
        run: |
          echo "Testing ${{ matrix.binary }} --help..."
          ./${{ matrix.binary }} --help | head -20
          echo "✅ Help check passed"

  create-release:
    name: Create GitHub Release
    needs: [build, test-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout guardrails-cli repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: |
          echo "📦 Downloaded artifacts:"
          ls -R artifacts/

      - name: Read build info
        id: build-info
        run: |
          COMMIT_SHA=$(cat artifacts/build-info/commit.txt)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "📌 turbot-core commit: $COMMIT_SHA"

      - name: Prepare release files
        run: |
          mkdir -p release
          # Copy zip files for release
          find artifacts -name "*.zip" -exec cp {} release/ \;
          echo "📦 Release files:"
          ls -lh release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.releaseVersion }}
          name: Release v${{ github.event.inputs.releaseVersion }}
          body: |
            ## CLI Binary Release v${{ github.event.inputs.releaseVersion }}

            Built using **Node.js SEA (Single Executable Applications)**.

            ### Source
            - **turbot-core branch**: `${{ github.event.inputs.turbotCoreBranch }}`
            - **turbot-core commit**: `${{ steps.build-info.outputs.commit_sha }}`
            - **Node.js version**: ${{ env.NODE_VERSION }}

            ### Downloads

            | Platform | Architecture | File |
            |----------|--------------|------|
            | macOS | Apple Silicon (arm64) | `turbot_cli_${{ github.event.inputs.releaseVersion }}_darwin_arm64.zip` |
            | macOS | Intel (x64) | `turbot_cli_${{ github.event.inputs.releaseVersion }}_darwin_amd64.zip` |
            | Linux | x64 | `turbot_cli_${{ github.event.inputs.releaseVersion }}_linux_amd64.zip` |
            | Windows | x64 | `turbot_cli_${{ github.event.inputs.releaseVersion }}_windows_amd64.zip` |

            ### Installation

            #### Linux
            ```bash
            curl -L -o turbot.zip https://github.com/turbot/guardrails-cli/releases/download/v${{ github.event.inputs.releaseVersion }}/turbot_cli_${{ github.event.inputs.releaseVersion }}_linux_amd64.zip
            unzip turbot.zip
            sudo mv turbot-linux-x64 /usr/local/bin/turbot
            sudo chmod +x /usr/local/bin/turbot
            turbot --version
            ```

            #### macOS (Apple Silicon)
            ```bash
            curl -L -o turbot.zip https://github.com/turbot/guardrails-cli/releases/download/v${{ github.event.inputs.releaseVersion }}/turbot_cli_${{ github.event.inputs.releaseVersion }}_darwin_arm64.zip
            unzip turbot.zip
            sudo mv turbot-macos-arm64 /usr/local/bin/turbot
            sudo chmod +x /usr/local/bin/turbot
            turbot --version
            ```

            #### macOS (Intel)
            ```bash
            curl -L -o turbot.zip https://github.com/turbot/guardrails-cli/releases/download/v${{ github.event.inputs.releaseVersion }}/turbot_cli_${{ github.event.inputs.releaseVersion }}_darwin_amd64.zip
            unzip turbot.zip
            sudo mv turbot-macos-x64 /usr/local/bin/turbot
            sudo chmod +x /usr/local/bin/turbot
            turbot --version
            ```

            #### Windows
            1. Download `turbot_cli_${{ github.event.inputs.releaseVersion }}_windows_amd64.zip`
            2. Extract to a directory (e.g., `C:\turbot`)
            3. Rename `turbot-windows-x64.exe` to `turbot.exe`
            4. Add the directory to your PATH
            5. Run `turbot --version` to verify

            ### Notes
            - Built using webpack bundling for optimal size and performance
            - No extraction required - instant startup on all platforms
            - Single self-contained binary with all dependencies embedded

          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    needs: [build, create-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## 🎉 CLI Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Version**: v${{ github.event.inputs.releaseVersion }}" >> $GITHUB_STEP_SUMMARY
          echo "- **turbot-core Branch**: \`${{ github.event.inputs.turbotCoreBranch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Node.js Version**: ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Method**: Node.js SEA (Single Executable Applications)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Platform Binaries" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | x64 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | x64 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | x64 (Intel) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | arm64 (Apple Silicon) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Release](https://github.com/turbot/guardrails-cli/releases/tag/v${{ github.event.inputs.releaseVersion }})" >> $GITHUB_STEP_SUMMARY
