name: Release CLI

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "The version number of the new release (e.g., 1.2.3)"
        required: true
      turbotCoreBranch:
        description: "The branch name from turbotio/turbot-core repo where CLI package is located"
        required: true
        default: "main"

jobs:
  build:
    name: Build ${{ matrix.platform }} Binary
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: macos-latest
            platform: macos
            arch: amd64

    steps:
      - name: Configure Git for Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config --global core.protectNTFS false
          git config --global core.longpaths true

      - name: Checkout turbot-core repository
        uses: actions/checkout@v4
        with:
          repository: turbotio/turbot-core
          ref: ${{ github.event.inputs.turbotCoreBranch }}
          ssh-key: ${{ secrets.TURBOT_CLI_DEPLOY_PRIVATE_KEY }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies in turbot-core monorepo
        run: npm ci

      - name: Install caxa globally
        run: npm install -g caxa

      - name: Make compile script executable
        shell: bash
        run: chmod +x compile-caxa.sh
        working-directory: lib/@turbot/cli

      - name: Create cross-platform build script
        shell: bash
        run: |
          cat > compile-caxa-ci.sh << 'SCRIPT_END'
          #!/bin/bash
          set -e

          echo "🔨 Building Turbot CLI with caxa for ${{ matrix.platform }}"

          PACKAGE_VERSION="${{ github.event.inputs.releaseVersion }}"
          PLATFORM="${{ matrix.platform }}"

          # Create staging directory
          STAGING_DIR=".staging-caxa"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"

          echo "📝 Preparing for caxa packaging..."

          # Copy app and dependencies to staging
          cp turbot.js "$STAGING_DIR/"
          cp -r cmds "$STAGING_DIR/"
          cp -r lib "$STAGING_DIR/"
          cp -r inspectTemplates "$STAGING_DIR/"
          cp -r docs "$STAGING_DIR/" 2>/dev/null || true
          cp .turbotIgnore "$STAGING_DIR/" 2>/dev/null || true
          cp package.json "$STAGING_DIR/"

          # Copy the Node.js runtime
          NODE_RUNTIME=$(command -v node)
          if [[ -z "$NODE_RUNTIME" ]]; then
            echo "❌ Unable to locate Node.js runtime on the build machine."
            exit 1
          fi
          cp "$NODE_RUNTIME" "$STAGING_DIR/node"
          chmod +x "$STAGING_DIR/node"

          # Copy node_modules
          echo "📋 Copying dependencies..."
          if command -v rsync &> /dev/null; then
            rsync -a \
              --exclude='**/test/**' \
              --exclude='**/tests/**' \
              --exclude='**/__tests__/**' \
              --exclude='**/docs/**' \
              --exclude='**/examples/**' \
              --exclude='**/*.md' \
              --exclude='**/.git/**' \
              ../../../node_modules/ "$STAGING_DIR/node_modules/"
          else
            cp -R ../../../node_modules "$STAGING_DIR/"
            find "$STAGING_DIR/node_modules" -type d \( -name test -o -name tests -o -name __tests__ -o -name docs -o -name examples \) -prune -exec rm -rf {} + 2>/dev/null || true
            find "$STAGING_DIR/node_modules" -type f -name '*.md' -delete 2>/dev/null || true
          fi

          # Remove optional heavy drivers
          echo "🧹 Removing unused optional modules..."
          rm -rf \
            "$STAGING_DIR/node_modules/pg-native" \
            "$STAGING_DIR/node_modules/pg-query-stream" \
            "$STAGING_DIR/node_modules/pg-cursor" \
            "$STAGING_DIR/node_modules/mysql" \
            "$STAGING_DIR/node_modules/mysql2" \
            "$STAGING_DIR/node_modules/oracledb" \
            "$STAGING_DIR/node_modules/mariasql" \
            "$STAGING_DIR/node_modules/tedious" \
            "$STAGING_DIR/node_modules/sqlite3" \
            "$STAGING_DIR/node_modules/node-sqlite3" 2>/dev/null || true

          # Bundle internal @turbot packages
          declare -a local_packages=(
            "cache" "compile-mod" "compose" "constants" "data-utils" "errors"
            "events" "filter-parser" "filter-parser-2" "flags" "fn" "graphql"
            "graphql-typedefs" "inline" "internal-utils" "jq-node" "ldap"
            "license" "locks" "log" "memory-cache" "mocha" 
            "mockserver-vcr-recorder-mocha" "mod" "nunjucks-core" "ocl" "rdb"
            "rdb-action-types" "rdb-actions" "rdb-active-grants" 
            "rdb-control-categories" "rdb-control-pivots" "rdb-control-types"
            "rdb-controls" "rdb-daily-stats" "rdb-directories" "rdb-favorites"
            "rdb-folders" "rdb-grants" "rdb-guardrail-accounts" 
            "rdb-guardrail-control-types" "rdb-guardrails" "rdb-iam" 
            "rdb-loaders" "rdb-locks" "rdb-membership-hierarchy" "rdb-mods"
            "rdb-navigation-hierarchy" "rdb-notifications" "rdb-permission-levels"
            "rdb-permission-types" "rdb-policies" "rdb-policy-hierarchy"
            "rdb-policy-types" "rdb-policy-value-pivots" "rdb-policy-values"
            "rdb-prevention-categories" "rdb-prevention-objectives" 
            "rdb-prevention-rule-examples" "rdb-prevention-rules" 
            "rdb-prevention-scores" "rdb-prevention-types" "rdb-process-logs"
            "rdb-processes" "rdb-processes-history" "rdb-query-builder"
            "rdb-resource-categories" "rdb-resource-groups" 
            "rdb-resource-interfaces" "rdb-resource-types" "rdb-resources"
            "rdb-rollout-accounts" "rdb-rollout-guardrails" "rdb-rollouts"
            "rdb-scheduled-actions" "rdb-tags" "rdb-tenant-metadata"
            "rdb-turbot-secrets" "rdb-watch-pivots" "rdb-watch-rules"
            "rdb-watches" "redis" "runnable-test-helper" "tdb-pool" "utils"
            "validator"
          )

          mkdir -p "$STAGING_DIR/node_modules/@turbot"

          for pkg in "${local_packages[@]}"; do
            if [[ -d ../../../lib/@turbot/$pkg ]]; then
              echo "📦 Bundling @turbot/$pkg"
              rm -rf "$STAGING_DIR/node_modules/@turbot/$pkg"
              mkdir -p "$STAGING_DIR/node_modules/@turbot/$pkg"
              
              if command -v rsync &> /dev/null; then
                rsync -aL \
                  --exclude 'node_modules' \
                  --exclude '.git' \
                  --exclude 'dist' \
                  --exclude 'test' \
                  --exclude 'tests' \
                  --exclude '__tests__' \
                  "../../../lib/@turbot/$pkg/" "$STAGING_DIR/node_modules/@turbot/$pkg/"
              else
                (cd "../../../lib/@turbot/$pkg" && \
                  tar -ch \
                    --exclude='node_modules' \
                    --exclude='.git' \
                    --exclude='dist' \
                    --exclude='test' \
                    --exclude='tests' \
                    --exclude='__tests__' \
                    -f - .) | \
                  (cd "$STAGING_DIR/node_modules/@turbot/$pkg" && tar -xf -)
              fi
            fi
          done

          # Create bootstrap script
          cat > "$STAGING_DIR/bootstrap.js" << 'BOOTSTRAP_EOF'
          const path = require("path");
          const Module = require("module");

          const appDir = __dirname;
          const nodeModulesPath = path.join(appDir, "node_modules");
          const atTurbotPath = path.join(nodeModulesPath, "@turbot");
          const localLibPath = path.join(appDir, "lib");

          const extraPaths = [nodeModulesPath, atTurbotPath, localLibPath];

          extraPaths.forEach((p) => {
            module.paths.unshift(p);
            Module.globalPaths.unshift(p);
          });

          const existingNodePath = process.env.NODE_PATH ? process.env.NODE_PATH.split(path.delimiter) : [];
          const mergedNodePath = [...extraPaths, ...existingNodePath.filter(Boolean)];
          process.env.NODE_PATH = mergedNodePath.join(path.delimiter);
          Module._initPaths();

          if (!process.env.TURBOT_CORE) {
            process.env.TURBOT_CORE = appDir;
          }

          process.argv[1] = "turbot";
          require("./turbot.js");
          BOOTSTRAP_EOF

          # Create launcher
          cat > "$STAGING_DIR/bootstrap-launcher.js" << 'LAUNCHER_EOF'
          const os = require("os");
          const path = require("path");
          const fs = require("fs");

          function resolveCacheDir() {
            if (process.platform === "win32") {
              const base = process.env.LOCALAPPDATA || path.join(os.homedir(), "AppData", "Local");
              return path.join(base, "TurbotCLI", "cache");
            }
            return path.join(os.homedir(), ".cache", "turbot-cli");
          }

          const cacheDir = process.env.CAXA_TMPDIR || resolveCacheDir();
          fs.mkdirSync(cacheDir, { recursive: true });
          process.env.CAXA_TMPDIR = cacheDir;

          require("./bootstrap.js");
          LAUNCHER_EOF

          mkdir -p dist

          # Build with caxa - create internal binary first
          echo "🔨 Building ${PLATFORM} binary..."
          caxa \
            --input "$STAGING_DIR" \
            --output "dist/turbot-internal" \
            --no-dedupe \
            -- "{{caxa}}/node" "{{caxa}}/bootstrap-launcher.js"

          # Determine final binary name based on platform
          if [[ "$PLATFORM" == "windows" ]]; then
            FINAL_BINARY="turbot.exe"
            INTERNAL_BINARY="turbot-internal"
            # For Windows, we'll use the caxa binary directly (no wrapper for now)
            mv "dist/$INTERNAL_BINARY" "dist/$FINAL_BINARY"
          else
            FINAL_BINARY="turbot"
            INTERNAL_BINARY="turbot-internal"
            
            # Create self-extracting wrapper script
            cat > "dist/$FINAL_BINARY" << 'WRAPPER_EOF'
          #!/bin/bash
          # Turbot CLI - self-extracting wrapper that ensures stable cache directory
          # This prevents macOS from cleaning up extracted files in system temp directories

          set -e

          # Determine cache directory based on OS
          if [[ "$OSTYPE" == "darwin"* ]] || [[ "$OSTYPE" == "linux-gnu"* ]]; then
            CACHE_DIR="${HOME}/.cache/turbot-cli"
          elif [[ "$OSTYPE" == "msys" ]] || [[ "$OSTYPE" == "win32" ]]; then
            CACHE_DIR="${LOCALAPPDATA:-${HOME}/AppData/Local}/TurbotCLI/cache"
          else
            CACHE_DIR="${TMPDIR:-/tmp}/turbot-cli"
          fi

          # Create cache directory
          mkdir -p "$CACHE_DIR" 2>/dev/null || {
            CACHE_DIR="${TMPDIR:-/tmp}/turbot-cli-$$"
            mkdir -p "$CACHE_DIR"
          }

          # Set CAXA_TMPDIR BEFORE executing caxa binary (caxa extracts in Go stub before Node.js runs)
          export CAXA_TMPDIR="$CACHE_DIR"

          # Path to extracted binary in cache
          BINARY_CACHE_PATH="$CACHE_DIR/turbot-internal"

          # Extract embedded binary on first run
          if [[ ! -f "$BINARY_CACHE_PATH" ]] || [[ "$0" -nt "$BINARY_CACHE_PATH" ]]; then
            # Find the line number where binary data starts
            BINARY_START_LINE=$(awk '/^__BINARY_START__$/ {print NR+1; exit}' "$0")
            if [[ -n "$BINARY_START_LINE" ]]; then
              # Extract and decode the embedded binary
              # Use -D flag for macOS compatibility (both -d and -D work, but -D is more explicit on macOS)
              tail -n +$BINARY_START_LINE "$0" | base64 -D > "$BINARY_CACHE_PATH" 2>/dev/null || \
              tail -n +$BINARY_START_LINE "$0" | base64 -d > "$BINARY_CACHE_PATH" 2>/dev/null
              chmod +x "$BINARY_CACHE_PATH"
            fi
          fi

          # Run the extracted binary
          if [[ -f "$BINARY_CACHE_PATH" ]]; then
            exec "$BINARY_CACHE_PATH" "$@"
          else
            echo "Error: Failed to extract turbot CLI binary" >&2
            exit 1
          fi

          # Binary data follows (base64 encoded)
          __BINARY_START__
          WRAPPER_EOF

            # Append base64-encoded binary to the wrapper script
            # Use stdin redirection for cross-platform compatibility
            base64 < "dist/$INTERNAL_BINARY" >> "dist/$FINAL_BINARY"
            chmod +x "dist/$FINAL_BINARY"
            
            # Clean up internal binary (no longer needed, it's embedded)
            rm -f "dist/$INTERNAL_BINARY"
          fi

          echo "✅ ${PLATFORM} binary created: dist/$FINAL_BINARY"

          # Create archive based on platform
          cd dist
          if [[ "$PLATFORM" == "linux" ]]; then
            zip "turbot_cli_${PACKAGE_VERSION}_linux_${{ matrix.arch }}.zip" "$FINAL_BINARY"
            echo "✅ Archive: turbot_cli_${PACKAGE_VERSION}_linux_${{ matrix.arch }}.zip"
          elif [[ "$PLATFORM" == "windows" ]]; then
            # Use 7z on Windows (available by default on GitHub runners)
            if command -v 7z &> /dev/null; then
              7z a -tzip "turbot_cli_${PACKAGE_VERSION}_windows_${{ matrix.arch }}.zip" "$FINAL_BINARY"
            elif command -v zip &> /dev/null; then
              zip "turbot_cli_${PACKAGE_VERSION}_windows_${{ matrix.arch }}.zip" "$FINAL_BINARY"
            else
              echo "⚠️  Warning: Neither 7z nor zip found, skipping archive creation"
            fi
            echo "✅ Archive: turbot_cli_${PACKAGE_VERSION}_windows_${{ matrix.arch }}.zip"
          else
            # macOS - use zip
            zip "turbot_cli_${PACKAGE_VERSION}_darwin_${{ matrix.arch }}.zip" "$FINAL_BINARY"
            echo "✅ Archive: turbot_cli_${PACKAGE_VERSION}_darwin_${{ matrix.arch }}.zip"
          fi
          cd ..

          # Cleanup
          rm -rf "$STAGING_DIR"
          echo "🎉 Build complete!"
          SCRIPT_END

          chmod +x compile-caxa-ci.sh
        working-directory: lib/@turbot/cli

      - name: Build binary
        shell: bash
        run: ./compile-caxa-ci.sh
        working-directory: lib/@turbot/cli

      - name: Verify binary was created
        shell: bash
        run: |
          # Determine final binary name
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            FINAL_BINARY="turbot.exe"
          else
            FINAL_BINARY="turbot"
          fi
          
          if [ -f "dist/$FINAL_BINARY" ]; then
            SIZE=$(du -h "dist/$FINAL_BINARY" | cut -f1)
            echo "✅ Binary verified: $FINAL_BINARY ($SIZE)"
            ls -lh dist/
          else
            echo "❌ Binary not found: dist/$FINAL_BINARY"
            exit 1
          fi
        working-directory: lib/@turbot/cli

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbot-cli-${{ matrix.platform }}-${{ matrix.arch }}-binary
          path: lib/@turbot/cli/dist/turbot*
          retention-days: 30

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: turbot-cli-${{ matrix.platform }}-${{ matrix.arch }}-archive
          path: lib/@turbot/cli/dist/turbot_cli_*.zip
          retention-days: 30

  test-binaries:
    name: Test ${{ matrix.platform }} Binary
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: macos-latest
            platform: macos
            arch: amd64

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v4
        with:
          name: turbot-cli-${{ matrix.platform }}-${{ matrix.arch }}-binary
          path: .

      - name: Make binary executable (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ -f "turbot" ]; then
            chmod +x turbot
          fi

      - name: Test binary - version check
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BINARY="turbot.exe"
          else
            BINARY="turbot"
          fi
          echo "Testing $BINARY..."
          ./$BINARY --version || true
          echo "✅ Binary executed successfully"

      - name: Test binary - help command
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BINARY="turbot.exe"
          else
            BINARY="turbot"
          fi
          ./$BINARY --help || true
          echo "✅ Help command executed"

      - name: Test binary - basic commands (if applicable)
        shell: bash
        continue-on-error: true
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            BINARY="turbot.exe"
          else
            BINARY="turbot"
          fi
          # Add any other basic CLI commands you want to test
          # These should not require authentication or external services
          ./$BINARY || true

  create-release:
    name: Create GitHub Release
    needs: [build, test-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout guardrails-cli repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: |
          echo "📦 Downloaded artifacts:"
          ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.releaseVersion }}
          name: Release v${{ github.event.inputs.releaseVersion }}
          body: |
            ## CLI Binary Release v${{ github.event.inputs.releaseVersion }}

            Built from:
            - **turbot-core branch**: `${{ github.event.inputs.turbotCoreBranch }}`
            - **guardrails-cli branch**: `${{ github.ref_name }}`

            ### Downloads
            - **Linux (amd64)**: `turbot_cli_${{ github.event.inputs.releaseVersion }}_linux_amd64.zip`
            - **macOS (amd64)**: `turbot_cli_${{ github.event.inputs.releaseVersion }}_darwin_amd64.zip`
            - **Windows (amd64)**: `turbot_cli_${{ github.event.inputs.releaseVersion }}_windows_amd64.zip`

            ### Installation

            #### Linux/macOS
            ```bash
            # Extract the archive
            unzip turbot_cli_${{ github.event.inputs.releaseVersion }}_linux_amd64.zip  # Linux
            unzip turbot_cli_${{ github.event.inputs.releaseVersion }}_darwin_amd64.zip      # macOS

            # Move to PATH
            sudo mv turbot /usr/local/bin/turbot
            sudo chmod +x /usr/local/bin/turbot
            ```

            #### Windows
            ```powershell
            # Extract the zip and add the directory to your PATH
            ```
          files: |
            artifacts/turbot-cli-linux-amd64-archive/*
            artifacts/turbot-cli-macos-amd64-archive/*
            artifacts/turbot-cli-windows-amd64-archive/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Build Summary
    needs: [build, create-release]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate summary
        run: |
          echo "## 🎉 CLI Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Version**: v${{ github.event.inputs.releaseVersion }}" >> $GITHUB_STEP_SUMMARY
          echo "- **turbot-core Branch**: \`${{ github.event.inputs.turbotCoreBranch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **guardrails-cli Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Linux binary (amd64)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ macOS binary (amd64)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Windows binary (amd64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Release" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Release](https://github.com/turbot/guardrails-cli/releases/tag/v${{ github.event.inputs.releaseVersion }})" >> $GITHUB_STEP_SUMMARY
